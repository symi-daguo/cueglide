name: CueGlide
options:
  bundleIdPrefix: com.symi
  deploymentTarget:
    iOS: "26.0"
  developmentLanguage: zh-Hans
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_UPCOMING_FEATURE_MEMBER_IMPORT_VISIBILITY: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    MARKETING_VERSION: "0.6.8"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    DEAD_CODE_STRIPPING: YES

targets:
  CueGlide:
    type: application
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: CueGlide
    info:
      path: CueGlide/Resources/Info.plist
      properties:
        CFBundleDevelopmentRegion: zh-Hans
        CFBundleDisplayName: CueGlide
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        ITSAppUsesNonExemptEncryption: false
        UIBackgroundModes:
          - audio
        NSCameraUsageDescription: 提词拍摄需要使用相机，画面只在你的设备上处理。
        NSMicrophoneUsageDescription: 语音跟读与录像收音需要使用麦克风，音频只在你的设备上处理。
        NSSpeechRecognitionUsageDescription: 语音跟读需要端侧语音识别，用于判断当前读到哪一句。
        NSPhotoLibraryAddUsageDescription: 保存录像到相册。
        NSHumanReadableCopyright: MIT License
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
        UIApplicationSupportsIndirectInputEvents: true
        UIUserInterfaceStyle: Automatic
        UILaunchScreen: {}
        UIStatusBarStyle: UIStatusBarStyleDefault
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.symi.cueglide
        PRODUCT_NAME: CueGlide
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        ENABLE_PREVIEWS: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

  CueGlideTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: CueGlideTests
    dependencies:
      - target: CueGlide
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.symi.cueglide.tests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "6.0"

  CueGlideUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: CueGlideUITests
    dependencies:
      - target: CueGlide
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.symi.cueglide.uitests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "6.0"

schemes:
  CueGlide:
    build:
      targets:
        CueGlide: all
        CueGlideTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - CueGlideTests
        - CueGlideUITests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
