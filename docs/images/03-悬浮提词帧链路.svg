"564" font-family="PingFang SC, Hiragino Sans GB, Alibaba PuHuiTi 2.0, sans-serif" font-size="16" font-weight="400" fill="#6B7280" text-anchor="start">手动 translate / scale 翻转容易搞反，交给 Core Image 更稳。</text><rect x="735" y="450" width="649" height="202" rx="18" fill="#FFFFFF" stroke="#E5E7EE" stroke-width="1"/><rect x="755" y="474" width="8" height="26" rx="4" fill="#4B6EF5"/><text x="775" y="496" font-family="PingFang SC, Hiragino Sans GB, Alibaba PuHuiTi 2.0, sans-serif" font-size="21" font-weight="600" fill="#0B0C0F" text-anchor="start">已知限制（真机待验）</text><text x="755" y="538" font-family="PingFang SC, Hiragino Sans GB, Alibaba PuHuiTi 2.0, sans-serif" font-size="16" font-weight="400" fill="#6B7280" text-anchor="start">模拟器 isPictureInPictureSupported 返回 false。</text><text x="755" y="564" font-family="PingFang SC, Hiragino Sans GB, Alibaba PuHuiTi 2.0, sans-serif" font-size="16" font-weight="400" fill="#6B7280" text-anchor="start">代码启动前检查，不支持时直接提示，不会卡住。</text></svg>